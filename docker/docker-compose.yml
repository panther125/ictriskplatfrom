# 风控策略配置平台 —— 一键快速部署编排
# 用法（在 docker/ 目录下执行）：
#   1) 复制 .env.example 为 .env（可选，用于自定义端口/口令）
#   2) docker compose up -d --build
#   3) 浏览器打开 http://localhost （前端端口见 .env 的 FRONTEND_PORT）
#
# 服务拓扑：
#   frontend(nginx:80) --> /api 反向代理 --> backend(8080) --> mysql(3306)
#                                        \-> python-runner(8090，仅内网)

services:
  mysql:
    image: mysql:8.0
    container_name: risk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: risk_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化脚本仅在数据卷为空（首次启动）时按文件名顺序执行一次
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/migration-2026-10-14-monitoring-fullchain.sql:/docker-entrypoint-initdb.d/02-monitoring-fullchain.sql:ro
      - ../database/demo-traffic-switch.sql:/docker-entrypoint-initdb.d/03-demo-traffic-switch.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - risk-net

  python-runner:
    build:
      context: ..
      dockerfile: docker/python-runner.Dockerfile
    image: risk-python-runner:1.0.0
    container_name: risk-python-runner
    restart: unless-stopped
    environment:
      PY_RUNNER_HOST: 0.0.0.0
      PY_RUNNER_PORT: "8090"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - risk-net

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: risk-backend:1.0.0
    container_name: risk-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      python-runner:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/risk_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      RISK_PYTHON_RUNNER_URL: http://python-runner:8090
      RISK_UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      TZ: Asia/Shanghai
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx1g}"
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - risk-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: risk-frontend:1.0.0
    container_name: risk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - risk-net

volumes:
  mysql-data:
  backend-uploads:

networks:
  risk-net:
    driver: bridge
